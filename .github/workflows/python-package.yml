# Simple build smoke test for green-igen: verify it builds and installs
# across the supported Python versions. Scaffold for a future Python unit-test
# suite (green-igen currently has only C++ ctest coverage, in test.yaml).

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y libblas-dev liblapack-dev libeigen3-dev libgmp-dev libmpfr-dev libfftw3-dev libhdf5-dev build-essential
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pytest
    - name: Build and install green-igen
      run: |
        python -m pip install .
    - name: Smoke test import
      run: |
        python -c "import green_igen; print('green-igen imported OK')"

    # Placeholder for a future green-igen Python unit-test suite:
    # - name: Run unit tests
    #   run: pytest test/ -v
