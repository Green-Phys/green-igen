name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false

    runs-on: [ self-hosted, ift-vm ]
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openmpi-bin libopenmpi-dev libhdf5-dev libeigen3-dev libopenblas-dev lcov libgmp-dev libmpfr-dev libfftw3-dev

    - name: Build
      run: |
        mkdir build && cd build && cmake  -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage " ..;
        make -j2 || make -j1 VERBOSE=1

    - name: Test
      env:
        HDF5_USE_FILE_LOCKING: 'FALSE'
      run: |
        cd build;
        ctest -j4 --output-on-failure
