name: Continuation CI/CD

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.plat.os }}
    runs-on: ${{ matrix.plat.os }}
    strategy:
      matrix:
        # macos-14 is apple silicon (arm64); the retired macos-13 intel runner is dropped
        plat:
        - { os: ubuntu-latest, target: "", arch: x86_64, homebrew: ''}
        - { os: macos-14, target: "14.0" , arch: arm64, homebrew: '/opt/homebrew'}

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          # Manylinux image and Linux before-all come from pyproject.toml
          # (manylinux_2_28 + dnf hdf5-devel/openblas-devel). The old
          # manylinux2014 image ships HDF5 1.8.12, which current h5py rejects.

          CIBW_ENVIRONMENT_MACOS: >
            GMP_DIR=${{ matrix.plat.homebrew }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_13:
    name: Build wheels on ${{ matrix.plat.os }}
    runs-on: ${{ matrix.plat.os }}
    strategy:
      matrix:
        # macos-14 is apple silicon (arm64); the retired macos-13 intel runner is dropped
        plat:
        - { os: ubuntu-latest, target: "", arch: x86_64, homebrew: ''}
        - { os: macos-14, target: "14.0" , arch: arm64, homebrew: '/opt/homebrew'}

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp313-* cp314-*
          CIBW_ARCHS: ${{ matrix.plat.arch }}

          CIBW_ENVIRONMENT_MACOS: >
            GMP_DIR=${{ matrix.plat.homebrew }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}-13
          path: ./wheelhouse/*.whl



  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_wheels_13, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # Upload to PyPI only on a published GitHub Release (a deliberate,
    # gated action - safer than uploading on any tag push).
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        #with:
          # To test: 
          # repository-url: https://test.pypi.org/legacy/
